worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;

    upstream api_backend {
        server 127.0.0.1:$PORT;   # Vercel‑এর ডাইনামিক পোর্টে রিভার্স
    }

    server {
        listen 80;
        server_name _;

        # স্ট্যাটিক Vite‑build ফাইল (কপি করা /app/static এ)
        root /app/static;
        index index.html;

        # পাথগুলোর জন্য ফাইল না থাকলে index.html রিটর্ন (SPA)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API রিকোয়েস্টকে ব্যাক‑এন্ডে ফোরোয়ার্ড
        location /api/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
